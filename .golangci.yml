# Vortechron Go standard. Same file in every Go repo.
# Limits come from the shared coding rules: small functions, low branching.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nestif
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    funlen:
      lines: 50
      statements: 40
      ignore-comments: true
    nestif:
      min-complexity: 4
    dupl:
      threshold: 150
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen, gocognit, gocyclo, dupl, gosec, goconst]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vortechron
